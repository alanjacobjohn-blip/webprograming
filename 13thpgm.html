
<!DOCTYPE html>
<html>
<body>

<label>Enter a string:</label>
<input type="text" id="str1"><br><br>

<label>Enter number:</label>
<input type="text" id="id1"><br><br>

<label>Enter power:</label>
<input type="text" id="id2"><br><br>

<button onclick="add()">Get Result</button>

<br><br>

<label>Length of the String:</label>
<input type="text" id="strlen"><br><br>

<label>Slice String:</label>
<input type="text" id="strsli"><br><br>

<label>Power of a number:</label>
<input type="text" id="ans"><br><br>

<label>Square root of the number:</label>
<input type="text" id="sqr"><br><br>

<label>Ceil of the number:</label>
<input type="text" id="ceil"><br><br>

<label>Floor of the number:</label>
<input type="text" id="floor">

<script>
function add()
{
    var s, a, b, c, n, m, i, sl, sli;

    s = document.getElementById("str1").value;
    sl = s.length;
    sli = s.slice(5, 11);

    a = Number(document.getElementById("id1").value);
    b = Number(document.getElementById("id2").value);

    c = Math.pow(a, b);
    n = Math.sqrt(a);
    m = Math.ceil(a);
    i = Math.floor(a);

    document.getElementById("strlen").value = sl;
    document.getElementById("strsli").value = sli;
    document.getElementById("ans").value = c;
    document.getElementById("sqr").value = n;
    document.getElementById("ceil").value = m;
    document.getElementById("floor").value = i;
}
</script>

</body>
</html>
