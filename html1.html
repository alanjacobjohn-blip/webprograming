<!DOCTYPE html>
<html>
<head>
   <title>Time Table</title>
   
</head>
<body><center>
    <h1>TIME TABLE</h1>
</center>
   
   <center>
 <table border="10">
       <tr>
           <th>Day/Period</th>
           <th>1</th>
           <th>2</th>
           <th>3</th>
           <th>4</th>
           <th>5</th>
           <th>6</th>
           <th>7</th>
           <th>8</th>
       </tr>
       <tr>
           <td class="highlight"><b>Monday</b></td>
           <td>Eng</td>
           <td>Mat</td>
           <td>Che</td>
           <td rowspan="6" class="special"><b>LUNCH</b></td>
           <td colspan="3" class="special">LAB</td>
           <td>Phy</td>
       </tr>
       <tr>
           <td class="highlight"><b>Tuesday</b></td>
           <td colspan="3" class="special">LAB</td>
           <td>Eng</td>
           <td>Che</td>
           <td>Mat</td>
           <td class="special">SPORTS</td>
       </tr>
       <tr>
           <td class="highlight"><b>Wednesday</b></td>
           <td>Mat</td>
           <td>Phy</td>
           <td>Eng</td>
           <td>Che</td>
           <td colspan="3">LIBRARY</td>
       </tr>
       <tr>
           <td class="highlight"><b>Thursday</b></td>
           <td>Phy</td>
           <td>Eng</td>
           <td>Che</td>
           <td colspan="3" class="special">LAB</td>
           <td>Mat</td>
       </tr>
       <tr>
           <td class="highlight"><b>Friday</b></td>
           <td colspan="3" class="special">LAB</td>
           <td>Mat</td>
           <td>Che</td>
           <td>Eng</td>
           <td>Phy</td>
       </tr>
     
   </table>
   </center>
  
</body>
</html>
